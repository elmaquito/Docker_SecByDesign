name: CI - Strict

on:
  push:
    branches: [ main, develop, default, ci-fix, 'feature/**' ]
  pull_request:
    branches: [ main, develop, default, ci-fix ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: '20'
  POSTGRES_VERSION: '16'

jobs:
  backend-lint:
    name: Backend - Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install
      - name: Run ESLint
        working-directory: backend
        run: npm run lint

  backend-test:
    name: Backend - Test & Coverage
    runs-on: ubuntu-latest
    needs: backend-lint
    strategy:
      matrix:
        node: [18, 20]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: notimatic_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Setup Test Database
        env:
          PGPASSWORD: test_password
        run: |
          # Wait for postgres service to be ready
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -U user && break
            echo "Waiting for postgres..."
            sleep 1
          done
          # Apply init SQL
          psql -h 127.0.0.1 -U user -d notimatic_test -f backend/init.sql
          # Run migrations (best effort)
          bash backend/migrate.sh || echo "Migration script returned non-zero (check logs)"
      - name: Run tests with coverage
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_USER: user
          DB_PASSWORD: test_password
          DB_NAME: notimatic_test
          JWT_SECRET: test_jwt_secret
          REFRESH_TOKEN_SECRET: test_refresh_secret
        run: npm test
      - name: Upload coverage artifact
        if: ${{ matrix.node == 20 }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.node }}
          path: backend/coverage
      - name: Check backend coverage thresholds
        working-directory: backend
        run: |
          node -e "const fs=require('fs');const p='coverage/coverage-summary.json';if(!fs.existsSync(p)){console.error('coverage file missing');process.exit(1);}const c=JSON.parse(fs.readFileSync(p));const total=c.total;const lines=(total&&total.lines&&total.lines.pct)||0;if(lines<75){console.error('Backend coverage below 75%:',lines);process.exit(1);}console.log('Backend coverage OK:',lines);"

  frontend-lint:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint || true  # lint not yet configured; remove '|| true' when enabled

  frontend-test:
    name: Frontend - Test & Coverage
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install
      - name: Run Vitest with coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Check frontend coverage thresholds
        working-directory: frontend
        run: |
          node -e "const fs=require('fs');const p='coverage/coverage-summary.json';if(!fs.existsSync(p)){console.error('coverage file missing');process.exit(1);}const c=JSON.parse(fs.readFileSync(p));const lines=(c.total&&c.total.lines&&c.total.lines.pct)||0; if(lines<70){console.error('Frontend coverage below 70%:',lines);process.exit(1);}console.log('Frontend coverage OK:',lines);"

  npm-audit:
    name: npm audit (backend+frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit backend
        working-directory: backend
        run: (npm ci || npm install) && npm audit --audit-level=critical
      - name: npm audit frontend
        working-directory: frontend
        run: (npm ci || npm install) && npm audit --audit-level=critical

  trivy-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    # Waits for both tests AND docker-build so it scans the exact built images
    needs: [docker-build, backend-test, frontend-test]
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
      - name: Load Docker images
        run: |
          docker load -i notimatic-backend.tar
          docker load -i notimatic-frontend.tar
      - name: Run Trivy scan on backend image
        uses: aquasecurity/trivy-action@v0.19.0
        with:
          image-ref: notimatic-backend:ci
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Run Trivy scan on frontend image
        uses: aquasecurity/trivy-action@v0.19.0
        with:
          image-ref: notimatic-frontend:ci
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    # Runs early – parallel with tests – so images are ready for trivy-scan
    # as soon as tests complete. Only requires lint to pass.
    needs: [backend-lint, frontend-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build multi-stage images
        run: |
          docker build -t notimatic-backend:ci -f infrastructure/Dockerfile.backend backend
          docker build -t notimatic-frontend:ci -f infrastructure/Dockerfile.frontend frontend
      - name: Export images as tar archives
        run: |
          docker save notimatic-backend:ci -o notimatic-backend.tar
          docker save notimatic-frontend:ci -o notimatic-frontend.tar
      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            notimatic-backend.tar
            notimatic-frontend.tar
          retention-days: 1

  e2e-smoke:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    needs: [docker-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm ci --prefix frontend || npm install --prefix frontend
          npm ci --prefix backend || npm install --prefix backend
          npm ci --prefix tests/e2e || npm install --prefix tests/e2e
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Start services (docker-compose)
        run: |
          docker compose -f infrastructure/docker-compose.dev.yml up -d
          
      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until docker compose -f infrastructure/docker-compose.dev.yml ps | grep -q "healthy\|running"; do sleep 2; done'
          
      - name: Check service health
        if: failure()
        run: |
          docker compose -f infrastructure/docker-compose.dev.yml ps
          docker compose -f infrastructure/docker-compose.dev.yml logs
          
      - name: Run Playwright smoke tests
        working-directory: tests/e2e
        run: npx playwright test --config=playwright.config.ts --project=chromium --reporter=list

  upload-reports:
    name: Upload Reports
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          pattern: backend-coverage-*
          merge-multiple: true
          path: backend-coverage
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend-coverage

  doc-conformity:
    name: Documentation & Conformity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate documentation presence
        run: |
          test -f docs/ARCHITECTURE.md && test -f docs/SECURITY.md && test -f docs/ROADMAP.md
      - name: Validate .env.example
        run: test -f backend/.env.example && test -f frontend/.env.example
      - name: Validate checklist
        run: grep -q 'Checklist' docs/ROADMAP.md

  # ─── Security / Infra jobs ──────────────────────────────────────────────────
  # All gated to workflow_dispatch (manual trigger).
  # Jobs xss-sqli-tests, firewall-scan, api-gw-tests, siem-log-check, and
  # ansible-automation use docker-compose.security-test.yml (WAF + backend + DB)
  # which runs on standard CI runners (bridge networks, no Docker Swarm required).
  #
  # Roadmap alignment:
  #   xss-sqli-tests   → Phase 2: WAF (OWASP ModSecurity CRS blocking mode)
  #   firewall-scan    → Phase 3: network isolation (nmap port exposure test)
  #   api-gw-tests     → Phase 4: API auth enforcement via WAF (Kong TBD)
  #   siem-log-check   → Phase 5: backend security-event logging (Wazuh TBD)
  #   ansible-automation → Phase 6: Ansible healthcheck + WAF security tests
  #   zap-scan         → Phase 2/3: ZAP baseline via WAF

  xss-sqli-tests:
    name: "Phase 2 – WAF: XSS/SQLi Blocking Tests"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [trivy-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and start security test stack (WAF + backend + DB)
        run: |
          docker compose -f infrastructure/docker-compose.security-test.yml up -d --build
      - name: Wait for WAF to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            echo "Waiting for WAF... ($i/30)"
            sleep 5
          done
          curl -sf http://localhost:8080/health || \
            { echo "WAF failed to start"; docker compose -f infrastructure/docker-compose.security-test.yml logs; exit 1; }
      - name: "Test XSS: <script> tag in query param blocked (expect HTTP 403)"
        run: |
          # %3Cscript%3Ealert%281%29%3C%2Fscript%3E = <script>alert(1)</script>
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://localhost:8080/api/notes?search=%3Cscript%3Ealert%281%29%3C%2Fscript%3E")
          echo "XSS test response: $STATUS"
          [ "$STATUS" = "403" ] || \
            { echo "FAIL: WAF did not block XSS payload (got $STATUS, expected 403)"; exit 1; }
          echo "✅ WAF blocked XSS payload"
      - name: "Test SQLi: UNION SELECT in query param blocked (expect HTTP 403)"
        run: |
          # %27%20UNION%20SELECT%201%2C2%2C3-- = ' UNION SELECT 1,2,3--
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://localhost:8080/api/notes?id=1%27%20UNION%20SELECT%201%2C2%2C3--")
          echo "SQLi UNION test response: $STATUS"
          [ "$STATUS" = "403" ] || \
            { echo "FAIL: WAF did not block SQLi UNION (got $STATUS, expected 403)"; exit 1; }
          echo "✅ WAF blocked SQLi UNION payload"
      - name: "Test SQLi: OR tautology in query param blocked (expect HTTP 403)"
        run: |
          # %27%20OR%20%271%27%3D%271 = ' OR '1'='1
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://localhost:8080/api/notes?id=1%27%20OR%20%271%27%3D%271")
          echo "SQLi OR test response: $STATUS"
          [ "$STATUS" = "403" ] || \
            { echo "FAIL: WAF did not block SQLi OR tautology (got $STATUS, expected 403)"; exit 1; }
          echo "✅ WAF blocked SQLi OR tautology"
      - name: Print WAF logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker-compose.security-test.yml logs waf
      - name: Tear down stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.security-test.yml down -v

  firewall-scan:
    name: "Phase 3 – Network Isolation: Port Exposure Scan"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [trivy-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install nmap
        run: sudo apt-get update && sudo apt-get install -y nmap
      - name: Build and start security test stack
        run: |
          docker compose -f infrastructure/docker-compose.security-test.yml up -d --build
      - name: Wait for WAF to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 5
          done
      - name: "Verify WAF port 8080 is accessible (should be OPEN)"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          [ "$STATUS" = "200" ] || \
            { echo "FAIL: WAF port 8080 not responding (got $STATUS)"; exit 1; }
          echo "✅ Port 8080 (WAF): OPEN as expected"
      - name: Scan ports to verify network isolation
        run: |
          nmap -Pn -p 3000,5432,8080 127.0.0.1 -oN nmap_result.txt
          cat nmap_result.txt
      - name: "Assert backend port 3000 is NOT directly exposed"
        run: |
          grep -E "3000/tcp\s+open" nmap_result.txt && \
            { echo "FAIL: Backend port 3000 is directly exposed (should be isolated behind WAF)"; exit 1; } || \
            echo "✅ Port 3000 (backend): not directly exposed"
      - name: "Assert database port 5432 is NOT exposed"
        run: |
          grep -E "5432/tcp\s+open" nmap_result.txt && \
            { echo "FAIL: DB port 5432 is directly exposed (critical security issue)"; exit 1; } || \
            echo "✅ Port 5432 (database): not exposed"
      - name: Tear down stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.security-test.yml down -v

  api-gw-tests:
    name: "Phase 4 – API Auth & Security Headers (Kong TBD)"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [trivy-scan]
    # NOTE: Kong API Gateway (Phase 4) not yet deployed.
    # Until then, this job validates auth enforcement and security headers
    # at the backend level via the WAF proxy.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and start security test stack
        run: |
          docker compose -f infrastructure/docker-compose.security-test.yml up -d --build
      - name: Wait for WAF to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 5
          done
          curl -sf http://localhost:8080/health || \
            { docker compose -f infrastructure/docker-compose.security-test.yml logs; exit 1; }
      - name: "Verify /api/notes requires authentication (expect 401)"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/notes)
          echo "Unauthenticated /api/notes: $STATUS"
          [ "$STATUS" = "401" ] || \
            { echo "FAIL: Expected 401, got $STATUS"; exit 1; }
          echo "✅ /api/notes correctly requires authentication"
      - name: "Verify invalid Bearer token is rejected (expect 401)"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer invalid.token.value" \
            http://localhost:8080/api/notes)
          echo "Invalid Bearer: $STATUS"
          [ "$STATUS" = "401" ] || \
            { echo "FAIL: Expected 401, got $STATUS"; exit 1; }
          echo "✅ Invalid Bearer token rejected"
      - name: "Verify /health is publicly accessible (expect 200)"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          [ "$STATUS" = "200" ] || \
            { echo "FAIL: Health endpoint returned $STATUS"; exit 1; }
          echo "✅ Health endpoint publicly accessible"
      - name: "Check security headers presence (helmet middleware)"
        run: |
          HEADERS=$(curl -sI http://localhost:8080/health)
          echo "$HEADERS"
          echo "$HEADERS" | grep -qi "x-content-type-options" && \
            echo "✅ X-Content-Type-Options present" || echo "⚠️  Missing X-Content-Type-Options"
          echo "$HEADERS" | grep -qi "x-frame-options" && \
            echo "✅ X-Frame-Options present" || echo "⚠️  Missing X-Frame-Options"
      - name: Tear down stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.security-test.yml down -v

  ansible-automation:
    name: "Phase 6 – Ansible: Healthcheck & WAF Security Validation"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [trivy-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
      - name: Build and start security test stack
        run: |
          docker compose -f infrastructure/docker-compose.security-test.yml up -d --build
      - name: Wait for WAF to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 5
          done
          curl -sf http://localhost:8080/health || \
            { docker compose -f infrastructure/docker-compose.security-test.yml logs; exit 1; }
      - name: "Run Ansible healthcheck playbook"
        run: |
          ansible-playbook \
            -i infrastructure/scripts/ansible/inventory.yml \
            infrastructure/scripts/ansible/healthcheck.yml \
            -v
      - name: "Run Ansible WAF security tests playbook"
        run: |
          ansible-playbook \
            -i infrastructure/scripts/ansible/inventory.yml \
            infrastructure/scripts/ansible/security_tests.yml \
            -v
      - name: Tear down stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.security-test.yml down -v

  siem-log-check:
    name: "Phase 5 – Security Event Logging (Wazuh SIEM TBD)"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [trivy-scan]
    # NOTE: Wazuh SIEM (Phase 5) not yet deployed.
    # Until then, this job validates that the backend produces structured
    # security-event log entries — a prerequisite for SIEM log shipping.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and start security test stack
        run: |
          docker compose -f infrastructure/docker-compose.security-test.yml up -d --build
      - name: Wait for WAF to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 5
          done
          curl -sf http://localhost:8080/health || \
            { docker compose -f infrastructure/docker-compose.security-test.yml logs; exit 1; }
      - name: Generate failed authentication events (brute-force simulation)
        run: |
          for i in $(seq 1 5); do
            curl -s -X POST http://localhost:8080/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"nonexistent_probe","password":"wrong_password"}' \
              -o /dev/null
            sleep 1
          done
          echo "Generated 5 failed login attempts"
      - name: "Verify backend produces log output (SIEM readiness)"
        run: |
          LOGS=$(docker compose -f infrastructure/docker-compose.security-test.yml logs backend 2>&1)
          echo "=== Backend logs (last 50 lines) ==="
          echo "$LOGS" | tail -50
          [ -n "$LOGS" ] || { echo "FAIL: Backend produced no logs"; exit 1; }
          echo "✅ Backend logging is active"
      - name: "Check backend logs for security event entries"
        run: |
          MATCHES=$(docker compose -f infrastructure/docker-compose.security-test.yml logs backend 2>&1 | \
            grep -Ei "error|warn|unauthorized|forbidden|login|auth|fail" | head -20)
          if [ -n "$MATCHES" ]; then
            echo "✅ Security events found in backend logs:"
            echo "$MATCHES"
          else
            echo "ℹ️  No explicit security-event lines found in backend stdout."
            echo "    Consider adding structured audit logging to auth routes (Phase 5 pre-work)."
          fi
      - name: Tear down stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.security-test.yml down -v

  zap-scan:
    name: "Phase 2/3 – OWASP ZAP Baseline Scan (via WAF)"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [trivy-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and start security test stack
        run: |
          docker compose -f infrastructure/docker-compose.security-test.yml up -d --build
      - name: Wait for WAF to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 5
          done
          curl -sf http://localhost:8080/health || \
            { docker compose -f infrastructure/docker-compose.security-test.yml logs; exit 1; }
      - name: Run OWASP ZAP Baseline Scan against WAF
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080/'
          fail_action: true
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
      - name: Tear down stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.security-test.yml down -v
