name: CI - Strict

on:
  push:
    branches: [ main, develop, defaut, ci-fix, 'feature/**' ]
  pull_request:
    branches: [ main, develop, defaut, ci-fix ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: '20'
  POSTGRES_VERSION: '16'

jobs:
  backend-lint:
    name: Backend - Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run ESLint
        working-directory: backend
        run: npm run lint

  backend-test:
    name: Backend - Test & Coverage
    runs-on: ubuntu-latest
    needs: backend-lint
    strategy:
      matrix:
        node: [18, 20]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: notimatic_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Setup Test Database
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U user -d notimatic_test -f backend/init.sql
          # Run migrations (best effort)
          bash backend/migrate.sh || echo "Migration script returned non-zero (check logs)"
      - name: Run tests with coverage
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_USER: user
          DB_PASSWORD: test_password
          DB_NAME: notimatic_test
          JWT_SECRET: test_jwt_secret
          REFRESH_TOKEN_SECRET: test_refresh_secret
        run: npm test -- --coverage
      - name: Upload coverage artifact
        if: ${{ matrix.node == 20 }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.node }}
          path: backend/coverage
      - name: Check backend coverage thresholds
        working-directory: backend
        run: |
          node -e "const fs=require('fs');const p='coverage/coverage-final.json';if(!fs.existsSync(p)){console.error('coverage file missing');process.exit(1);}const c=JSON.parse(fs.readFileSync(p));const total=c.total||c;const lines=(total.lines&&total.lines.pct)||((total.statements&&total.statements.pct)||0);if(lines<80){console.error('Backend coverage below 80%:',lines);process.exit(1);}console.log('Backend coverage OK:',lines);"

  frontend-lint:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  frontend-test:
    name: Frontend - Test & Coverage
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Vitest with coverage
        working-directory: frontend
        run: npm test -- --coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Check frontend coverage thresholds
        working-directory: frontend
        run: |
          node -e "const fs=require('fs');const p='coverage/coverage-summary.json';if(!fs.existsSync(p)){console.error('coverage file missing');process.exit(1);}const c=JSON.parse(fs.readFileSync(p));const lines=(c.total&&c.total.lines&&c.total.lines.pct)||0; if(lines<70){console.error('Frontend coverage below 70%:',lines);process.exit(1);}console.log('Frontend coverage OK:',lines);"

  npm-audit:
    name: npm audit (backend+frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit backend
        working-directory: backend
        run: npm ci && npm audit --audit-level=critical
      - name: npm audit frontend
        working-directory: frontend
        run: npm ci && npm audit --audit-level=critical

  trivy-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -t notimatic-backend:ci -f backend/Dockerfile backend
          docker build -t notimatic-frontend:ci -f frontend/Dockerfile frontend
      - name: Run Trivy scan on backend image
        uses: aquasecurity/trivy-action@v0.19.0
        with:
          image-ref: notimatic-backend:ci
          severity: CRITICAL
      - name: Run Trivy scan on frontend image
        uses: aquasecurity/trivy-action@v0.19.0
        with:
          image-ref: notimatic-frontend:ci
          severity: CRITICAL

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build multi-stage images
        run: |
          docker build -t notimatic-backend:latest -f backend/Dockerfile backend
          docker build -t notimatic-frontend:latest -f frontend/Dockerfile frontend
      - name: Save images (optional)
        run: |
          docker save notimatic-backend:latest -o notimatic-backend.tar || true
          docker save notimatic-frontend:latest -o notimatic-frontend.tar || true
      - name: Upload images as artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            notimatic-backend.tar
            notimatic-frontend.tar

  e2e-smoke:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [docker-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          npm ci --prefix tests/e2e
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Start services (docker-compose)
        run: |
          # Ajustez le chemin si nécessaire; utilisation proposée : Docker_SecByDesign/infrastructure/docker-compose.yml
          docker compose -f Docker_SecByDesign/infrastructure/docker-compose.yml up -d
      - name: Wait services
        run: sleep 20
      - name: Run Playwright smoke tests
        working-directory: tests/e2e
        run: npx playwright test --config=playwright.config.ts --project=chromium --reporter=list

  upload-reports:
    name: Upload Reports
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          pattern: backend-coverage-*
          merge-multiple: true
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage