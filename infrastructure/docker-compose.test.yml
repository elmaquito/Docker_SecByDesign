services:
  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
    ports:
      - "3001:3000"
    environment:
      - DB_HOST=database
      - DB_USER=notimatic_user
      - DB_PASSWORD=test_password
      - DB_NAME=notimatic_db
      - NODE_ENV=production
      - JWT_SECRET=test_secret
      - POSTGRES_DB=notimatic_db
      - POSTGRES_USER=notimatic_user
      - POSTGRES_PASSWORD=test_password
    secrets: [] # Remove secrets requirement for local test
    depends_on:
      - database

  database:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=notimatic_user
      - POSTGRES_DB=notimatic_db
      - POSTGRES_PASSWORD=test_password
    secrets: [] # Remove secrets requirement for local test
    ports:
      - "5432:5432" # Optional, for debugging DB if needed
