version: '3.8'

services:
  # proxy:
  #   image: traefik:v2.10
  #   command:
  #     - "--api.insecure=true" # Dashboard enabled for dev
  #     - "--providers.docker=true"
  #     # - "--providers.docker.endpoint=unix:///var/run/docker.sock" # Let Traefik discover default
  #     - "--entrypoints.web.address=:80"
  #   ports:
  #     - "80:80"
  #     - "8080:8080" # Traefik Dashboard
  #   volumes:
  #     - "//var/run/docker.sock:/var/run/docker.sock:ro"
  #   networks:
  #     - net-dev

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/Dockerfile.frontend
      target: builder # Use builder stage for dev (with node installed)
    command: npm run dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173" # Direct access for dev
    networks:
      - net-dev
    # labels:
    #   - "traefik.http.routers.front.rule=Host(`localhost`)"

  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
      target: builder
    command: npm run start:dev
    volumes:
      - ../backend:/app
      - /app/node_modules
    ports:
      - "3001:3000" # Direct access for dev (3001 to avoid conflict with Obsidian)
    environment:
      - DB_HOST=database
      - DB_PASSWORD=dev_secret_password
    networks:
      - net-dev
    # labels:
    #   - "traefik.http.routers.api.rule=Host(`api.localhost`)"

  database:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=dev_secret_password
      - POSTGRES_DB=notimatic_dev
    ports:
      - "5432:5432" # Exposed for local tools (DBeaver)
    volumes:
      - ../backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - net-dev

networks:
  net-dev:
