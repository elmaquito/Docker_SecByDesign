# Security CI test stack – Roadmap Phases 2 & 3 (WAF + network isolation)
# Usage: docker compose -f infrastructure/docker-compose.security-test.yml up -d --build
#
# Validates:
#   - WAF (OWASP ModSecurity CRS) blocks OWASP Top-10 payloads (XSS, SQLi, path traversal)
#   - Database (port 5432) is isolated to net-data: NOT reachable from outside
#   - Backend (port 3000) is isolated to net-api: NOT directly reachable from outside
#   - All external traffic transits through the WAF (sole entry point: port 8080)
#
# Phases 4–6 (Kong API GW, Wazuh SIEM, Ansible) require dedicated stacks
# provisioned in the target environment, not in standard CI runners.

services:

  # ── Database (Phase 1) ──────────────────────────────────────────────────────
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: notimatic_user
      POSTGRES_DB: notimatic_db
      POSTGRES_PASSWORD: ci_sec_test_password
    volumes:
      - ../backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - net-data
    # Intentionally NOT on net-public — validates DB isolation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notimatic_user -d notimatic_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Backend API (Phase 1) ───────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
    environment:
      DB_HOST: database
      DB_USER: notimatic_user
      DB_PASSWORD: ci_sec_test_password
      DB_NAME: notimatic_db
      NODE_ENV: production
      JWT_SECRET: ci_sec_jwt_secret_minimum_32_chars_x
      REFRESH_TOKEN_SECRET: ci_sec_refresh_secret_min_32_chars_x
    networks:
      - net-api
      - net-data
    # Intentionally NO ports: mapping — backend is NOT directly reachable from outside
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # distroless/nodejs image: use node itself for healthcheck (no shell/curl available)
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12

  # ── WAF – OWASP ModSecurity CRS (Phase 2) ──────────────────────────────────
  # Uses the official owasp/modsecurity-crs image which bundles the OWASP CRS
  # rule set. MODSEC_RULE_ENGINE=On enables blocking mode (vs DetectionOnly).
  waf:
    image: owasp/modsecurity-crs:nginx
    environment:
      BACKEND: http://backend:3000
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: 1
      ANOMALY_INBOUND: 5
      ANOMALY_OUTBOUND: 4
      PORT: 80
    ports:
      - "8080:80"
    networks:
      - net-api
      - net-public
    depends_on:
      backend:
        condition: service_healthy

networks:
  net-public:
    driver: bridge
  net-api:
    driver: bridge
  net-data:
    driver: bridge
    internal: true   # Database has no external route — validates Phase 3 isolation
