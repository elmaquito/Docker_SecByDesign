# NOTIMATIC — Docker Compose Complet (Référence Unifiée)
#
# Ce fichier est une référence documentée combinant les configurations
# dev et prod en un seul document pédagogique.
#
# Pour l'utilisation réelle :
#   - Développement : infrastructure/docker-compose.dev.yml
#   - Production    : infrastructure/docker-compose.prod.yml
#   - Tests CI/CD   : infrastructure/docker-compose.test.yml
#
# Date : 2026-04-01
# Version projet : v1.2.0
# Commit : d43a8a27e16b58aad6e0639d1f329fed295f95f9

